[pytest]
DJANGO_SETTINGS_MODULE = config.settings
django_find_project = true
python_files = test_*.py
markers =
    unit: Schnelle Tests ohne externe Abhängigkeiten.
    integration: Tests der Django-Views und Datenbank.
    security: Sicherheitsrelevante Prüfungen.

# Automatische Coverage-Konfiguration
addopts = --cov=portfolio --cov-report=term-missing