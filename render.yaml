services:
  - type: web
    name: MyPortfolio
    runtime: python
    repo: https://github.com/dfluechter/django_react_portfolio
    plan: free
    envVars:
      - key: DATABASE_URL
        value: postgres://user:password@host:5432/dbname
      - key: PYTHON_VERSION
        value: '3.13'
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application
    autoDeployTrigger: commit
version: '1'
